server:
  port: 8010

spring:
  application:
    name: mall-auth-service
  cloud:
    nacos:
      server-addr: 192.168.193.131:8848
      discovery:
        server-addr: 192.168.193.131:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 在 localhost：库名 mall_x（docs/init.sql 已建库）
    url: jdbc:mysql://localhost:3306/mall_x?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root        # 按本机实际密码修改
  # Redis（192.168.193.131）本服务暂不使用，后续里程碑启用：
  # data:
  #   redis:
  #     host: 192.168.193.131
  #     port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

mall:
  jwt:
    # 与 mall-gateway 必须一致
    secret: MallX@2026$Secret!Key_AlphaBeta1234
    expire-seconds: 7200
