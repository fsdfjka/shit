server:
  port: 8012

spring:
  application:
    name: mall-merchant-service
  cloud:
    nacos:
      server-addr: 192.168.193.131:8848
      discovery:
        server-addr: 192.168.193.131:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 在 localhost：库名 mall_x（docs/init.sql 已建库；各服务直连仅查读自己业务域的表）
    url: jdbc:mysql://localhost:3306/mall_x?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root        # 按本机实际密码修改
  # Redis（192.168.193.131）本服务暂未启用，后续里程碑开启：
  # data:
  #   redis:
  #     host: 192.168.193.131
  #     port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# MinIO 对象存储（mall-common 组件，192.168.193.131 与 Nacos/Redis 同主机）
mall:
  minio:
    endpoint: http://192.168.193.131:9000
    access-key: root
    secret-key: "12345678"
    bucket: mall-x
